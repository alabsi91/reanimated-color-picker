<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta content="light dark" name="color-scheme" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <link bundle href="@styles/docs.css" rel="stylesheet" />
    <link href="@assets/favicon.ico" rel="icon" sizes="any" />
    <link type="image/svg" href="@assets/favicon.svg" rel="icon" />
    <link href="@assets/apple-touch-icon.png" rel="apple-touch-icon" />
    <!-- eslint-disable-next-line html/use-baseline -->
    <link href="@assets/manifest.json" rel="manifest" />
    <meta content="A Pure JavaScript Color Picker for React Native." name="description" />
    <!-- eslint-disable-next-line html/use-baseline -->
    <meta content="#f9f8f9" media="(prefers-color-scheme: light)" name="theme-color" />
    <!-- eslint-disable-next-line html/use-baseline -->
    <meta content="#121112" media="(prefers-color-scheme: dark)" name="theme-color" />
    <title data-translate>Reanimated Color Picker</title>
  </head>

  <body>
    <part
      maxHeading="{{ $data.maxHeading ?? 3 }}"
      minHeading="{{ $data.minHeading ?? 2 }}"
      src="@staticbolt/docs/parts/document/document.part.html"
      title="Reanimated Color Picker"
    >
      <part slot="icons" src="@parts/social-icons/social-icons.part.html"></part>
      <slot />
    </part>

    <part production-only src="@parts/service-worker/service-worker.part.html"></part>
  </body>
</html>
